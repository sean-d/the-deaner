name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p the-deaner --target ${{ matrix.target }}
      - name: Package
        run: |
          name=the-deaner-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/the-deaner README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: the-deaner-*.tar.gz*

  # An Arch package (CachyOS, EndeavourOS, Omarchy) from the Linux x86_64 binary above:
  # `sudo pacman -U the-deaner-<version>-1-x86_64.pkg.tar.zst`.
  arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: x86_64-unknown-linux-gnu
      - name: makepkg
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="the-deaner-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir /tmp/pkg
          cp packaging/arch/PKGBUILD packaging/arch/the-deaner.install "$tarball" /tmp/pkg/
          sum=$(sha256sum "$tarball" | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=${version}/" -e "s/^sha256sums=.*/sha256sums=('${sum}')/" /tmp/pkg/PKGBUILD
          # makepkg won't run as root. Dependencies are checked when you install, not here.
          useradd -m builder
          chown -R builder /tmp/pkg
          su builder -c "cd /tmp/pkg && makepkg --nodeps --noconfirm"
          cp /tmp/pkg/*.pkg.tar.zst .
          for f in *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: the-deaner-*.pkg.tar.zst*

  release:
    needs: [build, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            the-deaner-*.tar.gz*
            the-deaner-*.pkg.tar.zst*
          generate_release_notes: true

  # Point the Homebrew tap at this release: brew install sean-d/tap/the-deaner.
  # HOMEBREW_TAP_TOKEN is a fine-grained token that can write to sean-d/homebrew-tap only.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: aarch64-apple-darwin
      - name: Fill in the formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          sum=$(cut -d' ' -f1 "the-deaner-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz.sha256")
          sed -e "s/@VERSION@/${version}/g" -e "s/@SHA256@/${sum}/" \
            -e '/^# Template:/,/^# github.com/d' packaging/homebrew/the-deaner.rb > the-deaner.rb
          cat the-deaner.rb
      - uses: actions/checkout@v7
        with:
          repository: sean-d/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push it to the tap
        run: |
          mkdir -p tap/Formula
          cp the-deaner.rb tap/Formula/the-deaner.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/the-deaner.rb
          git commit -m "the-deaner ${GITHUB_REF_NAME}"
          git push
